name: iOS simulator smoke test

on:
  push:
    branches: ['devin/*ios-sim-smoke*']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Select Xcode 26+
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: npm ci && npm run ios:sync
      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Boot simulator, launch app, capture console and screenshots
        run: |
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')][-1])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          (xcrun simctl launch --console-pty "$UDID" io.github.namesphill.xolorun > out/console.txt 2>&1 &)
          for t in 10 30 60; do sleep $([ $t = 10 ] && echo 10 || echo 20); [ $t = 60 ] && sleep 10; xcrun simctl io "$UDID" screenshot out/shot-${t}s.png; done
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App" OR process CONTAINS "WebContent" OR process CONTAINS "GPU"' > out/syslog.txt 2>&1 || true
          echo "----- console -----"; cat out/console.txt | tail -80
          echo "----- syslog (filtered) -----"; grep -iE "error|exception|fail|denied|crash|jetsam|terminat" out/syslog.txt | tail -60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-smoke
          path: out
